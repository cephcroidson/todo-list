<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>My To-Do List</h1>
       <button id="themeToggle">🌙 Dark Mode</button>
        <div class="input-area">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >
              <input
    type="date"
    id="taskDate"
>
            <button id="addButton">Add</button>
        </div>
<div class="search-area">
    <input
        type="text"
        id="searchInput"
        placeholder="Search tasks..."
    >
</div>

        <ul id="taskList"></ul>
<div id="emptyState" class="empty-state">
    <div id="emptyIcon">📋</div>
    <h3 id="emptyTitle">No tasks yet</h3>
    <p id="emptyMessage">Add a task above to get started.</p>
</div>
<div class="statistics">
    <div>
        <strong id="totalTasks">0</strong>
        <span>Total</span>
    </div>

    <div>
        <strong id="activeTasks">0</strong>
        <span>Active</span>
    </div>

    <div>
        <strong id="completedTasks">0</strong>
        <span>Completed</span>
    </div>
</div>
<p id="taskCounter">0 tasks remaining</p>
<div class="filters">
    <button id="allFilter">All</button>
    <button id="activeFilter">Active</button>
    <button id="completedFilter">Completed</button>
</div>
<button id="clearCompleted">Clear Completed</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
